[package]
name = "media-platform-desktop"
version = "0.1.0"
description = "A fast local media library and player"
edition = "2021"

[workspace]
members = ["media-core"]
resolver = "2"

[lib]
name = "media_platform_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
media-core = { path = "media-core" }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
debug = 0
incremental = true

[profile.test]
debug = 0
incremental = false
