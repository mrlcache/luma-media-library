[package]
name = "media-platform-desktop"
version = "0.2.2"
description = "A fast local media library and player"
license = "GPL-2.0-or-later"
edition = "2021"

[workspace]
members = ["media-core"]
resolver = "2"

[lib]
name = "media_platform_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
hmac = "0.12"
getrandom = "0.4"
media-core = { path = "media-core" }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["macros"] }

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
debug = 0
incremental = true

[profile.test]
debug = 0
incremental = false

[profile.release.package.media-platform-desktop]
opt-level = 1
codegen-units = 256
