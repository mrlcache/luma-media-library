    <linearGradient id="blue" x2=".8" y2="1"><stop stop-color="#4f6d79"/><stop offset="1" stop-color="#111b23"/></linearGradient>
    <linearGradient id="gold" x2=".8" y2="1"><stop stop-color="#7b6855"/><stop offset="1" stop-color="#1d1e22"/></linearGradient>
    <linearGradient id="slate" x2=".8" y2="1"><stop stop-color="#526162"/><stop offset="1" stop-color="#121d21"/></linearGradient>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#surface)"/>
