<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Luma</title>
  <desc id="desc">A home for your movies and series. Dark Luma branding with an abstract collection of media cards.</desc>
